<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>My Work</title>
<link rel="icon" href="favicon.png">
<style>
:root {
  --navy: #041E42; --cyan: #00A3E0; --tint: #E8F6FC;
  --bg: #F5F5F7; --card: #fff; --line: #E8E8ED; --line-2: #D2D2D7;
  --ink: #1D1D1F; --ink-2: #424245; --muted: #6E6E73; --faint: #A1A1A6;
  --ok: #1E8E5A; --ok-bg: #E7F5EE; --wait: #B7791F; --wait-bg: #FDF3E1; --open: #0077A8; --open-bg: #E8F6FC;
  color-scheme: light;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.47 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; }
@media (min-width: 900px) { .wrap { padding-inline: 32px; } }

#gate { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: linear-gradient(180deg, #fff 0%, var(--bg) 100%); }
.signin { width: 100%; max-width: 360px; display: grid; gap: 20px; text-align: center; }
.signin img { width: 44px; height: 44px; justify-self: center; }
.signin h1 { font-size: 34px; line-height: 1.1; font-weight: 600; letter-spacing: -0.03em; margin: 0; }
.signin p { margin: -8px 0 0; color: var(--muted); }
.signin input[type=password] { width: 100%; font-size: 17px; border: 1px solid var(--line-2); border-radius: 12px; padding: 14px 16px; background: #fff; outline: none; }
.signin input[type=password]:focus { border-color: var(--cyan); }
.signin label { display: flex; gap: 8px; justify-content: center; align-items: center; color: var(--muted); font-size: 14px; }
.btn { border: 0; border-radius: 980px; padding: 12px 22px; background: var(--navy); color: #fff; font-weight: 600; cursor: pointer; }
.err { color: #C4302B; font-size: 14px; min-height: 20px; }

header { position: sticky; top: 0; z-index: 5; background: rgba(245,245,247,.82); backdrop-filter: saturate(180%) blur(18px); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 12px; height: 56px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; color: var(--navy); }
.brand img { width: 26px; height: 26px; }
.seg { margin-left: auto; display: flex; background: #E8E8ED; border-radius: 980px; padding: 3px; }
.seg button { border: 0; background: none; padding: 5px 14px; border-radius: 980px; cursor: pointer; color: var(--ink-2); font-size: 14px; }
.seg button[aria-pressed=true] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 500; }
.lock { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 6px 2px; }

main { padding: 36px 0 64px; }
h2 { font-size: 34px; font-weight: 600; letter-spacing: -0.03em; margin: 0; line-height: 1.1; }
.sub { color: var(--muted); margin: 8px 0 0; }
.nav { display: flex; gap: 8px; flex-wrap: wrap; margin: 24px 0 28px; }
.nav a { display: inline-flex; gap: 8px; align-items: center; text-decoration: none; color: var(--ink); background: #fff; border-radius: 980px; padding: 7px 14px 7px 12px; font-size: 14px; font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.nav a i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.nav a b { font-weight: 500; color: var(--muted); font-size: 13px; }

.cat { background: var(--card); border-radius: 20px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.04); scroll-margin-top: 72px; }
.ch { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; }
.ico { width: 40px; height: 40px; border-radius: 12px; background: var(--c); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.ch h3 { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -0.02em; }
.ch p { margin: 1px 0 0; color: var(--muted); font-size: 14px; }
.cnt { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.pill { font-size: 12px; padding: 3px 10px; border-radius: 980px; font-weight: 500; white-space: nowrap; }
.p-done { background: var(--ok-bg); color: var(--ok); }
.p-open { background: var(--open-bg); color: var(--open); }
.p-wait { background: var(--wait-bg); color: var(--wait); }
.prog { height: 4px; background: var(--line); border-radius: 4px; margin: 18px 0 6px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--c); border-radius: 4px; }
.groups { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 32px; }
@media (max-width: 760px) { .groups { grid-template-columns: 1fr; } .ch { grid-template-columns: auto 1fr; } .cnt { grid-column: 1 / -1; justify-content: flex-start; } }
.grp h4 { margin: 18px 0 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.pt { display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); align-items: start; }
.grp h4 + .pt { border-top: 0; }
.st { width: 18px; height: 18px; border-radius: 50%; margin-top: 2px; display: grid; place-items: center; border: 0; padding: 0; cursor: pointer; background: none; }
.st.done { background: var(--ok); }
.st.done::after { content: ""; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.st.open { border: 2px solid var(--line-2); }
.st.open:hover { border-color: var(--ok); }
.st.wait { border: 2px solid var(--wait); }
.st.wait::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--wait); }
.pt .tx { font-size: 14.5px; }
.pt.done .tx { color: var(--ink-2); }
.pt .nt { font-size: 13px; color: var(--muted); }
.pt .dt { font-size: 12px; color: var(--faint); white-space: nowrap; margin-top: 2px; font-variant-numeric: tabular-nums; }
.pt.wait .dt, .pt.open .dt { color: var(--muted); }
.key { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 6px; }
.key span { display: inline-flex; gap: 6px; align-items: center; }
.key .st { cursor: default; width: 14px; height: 14px; margin: 0; }
.key .st.done::after { width: 4px; height: 7px; }
footer { color: var(--faint); font-size: 12px; text-align: center; padding: 8px 0 40px; }
</style>
</head>
<body>
<div id="gate">
  <form class="signin" id="f">
    <img src="logo.png" alt="" onerror="this.src='favicon.png'">
    <h1>My work</h1>
    <p>Personal tracker. Enter your passphrase.</p>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Passphrase" required>
    <label><input type="checkbox" id="rem" checked> Keep me signed in on this device</label>
    <button class="btn" id="go">Open</button>
    <div class="err" id="err"></div>
  </form>
</div>

<div id="app" hidden>
  <header><div class="wrap bar">
    <div class="brand"><img src="favicon.png" alt=""><span>My Work</span></div>
    <div class="seg" role="group" aria-label="Show">
      <button data-f="all" aria-pressed="true">All</button><button data-f="pending" aria-pressed="false">Pending</button><button data-f="done" aria-pressed="false">Done</button>
    </div>
    <button class="lock" id="lock">Lock</button>
  </div></header>
  <main class="wrap">
    <h2>What I've been working on</h2>
    <p class="sub" id="sum"></p>
    <div class="key"><span><i class="st done"></i>Done</span><span><i class="st open"></i>To do</span><span><i class="st wait"></i>Waiting on someone</span></div>
    <nav class="nav" id="nav"></nav>
    <div id="cats"></div>
  </main>
  <footer id="foot"></footer>
</div>
<script>
const COL = { crm: "#041E42", exotel: "#00A3E0", caredesk: "#C2417B", gr8: "#E0662B", training: "#1E8E5A", marketing: "#7A5AF8", dash: "#5B6B7F" };
const ICO = { crm: "CR", exotel: "EX", caredesk: "CD", gr8: "G8", training: "TR", marketing: "MK", dash: "DB" };
const STORE = "me-work-v2", KEY = "me-tracker-key";
let D, S = {}, F = "all";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };

async function unlock(pass, rawKey) {
  const enc = await (await fetch("data.enc", { cache: "no-store" })).json();
  let key;
  if (rawKey) key = await crypto.subtle.importKey("raw", b64(rawKey), "AES-GCM", true, ["decrypt"]);
  else {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(enc.salt), iterations: enc.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.ct));
  const json = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return { data: JSON.parse(json), key };
}
$("#f").onsubmit = async e => {
  e.preventDefault(); $("#go").disabled = true; $("#err").textContent = "";
  try {
    const { data, key } = await unlock($("#pw").value);
    if ($("#rem").checked) { const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key)); store.set(KEY, btoa(String.fromCharCode(...raw))); }
    start(data);
  } catch (err) { $("#err").textContent = "That passphrase didn't work."; }
  $("#go").disabled = false;
};
$("#lock").onclick = () => { store.del(KEY); location.reload(); };
(async () => { const k = store.get(KEY); if (k) try { start((await unlock(null, k)).data); } catch (e) { store.del(KEY); } })();

const fmtD = s => s ? new Date(s + "T00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" }) : "";
function start(data) {
  D = data;
  try { S = JSON.parse(store.get(STORE) || "{}"); } catch (e) {}
  $("#gate").hidden = true; $("#app").hidden = false;
  document.querySelectorAll(".seg button").forEach(b => b.onclick = () => { F = b.dataset.f; document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); });
  $("#foot").textContent = `Updated ${fmtD(D.asof.slice(0, 10))} from your mail and project work. Tap a circle to mark a point done (saved on this device).`;
  render();
}
const idOf = (c, t) => c + ":" + t;
const stOf = (c, p) => S[idOf(c, p[0])] ? "done" : p[1];
function render() {
  let done = 0, pend = 0;
  const cats = D.cats.map(c => {
    const pts = c.g.flatMap(g => g[1]).map(p => stOf(c.k, p));
    const n = { done: pts.filter(s => s === "done").length, open: pts.filter(s => s === "open").length, wait: pts.filter(s => s === "wait").length, all: pts.length };
    done += n.done; pend += n.open + n.wait;
    return { c, n };
  });
  $("#sum").textContent = `${D.cats.length} areas · ${done} done · ${pend} pending`;
  $("#nav").innerHTML = cats.map(({ c, n }) => `<a href="#${c.k}" style="--c:${COL[c.k]}"><i></i>${esc(c.n)}${n.open + n.wait ? `<b>${n.open + n.wait} pending</b>` : ""}</a>`).join("");
  const keep = s => F === "all" || (F === "done" ? s === "done" : s !== "done");
  $("#cats").innerHTML = cats.map(({ c, n }) => {
    const groups = c.g.map(([gn, ps]) => {
      const rows = ps.filter(p => keep(stOf(c.k, p))).sort((a, b) => F === "all" ? 0 : 0);
      return rows.length ? `<div class="grp"><h4>${esc(gn)}</h4>${rows.map(p => {
        const s = stOf(c.k, p);
        return `<div class="pt ${s}"><button class="st ${s}" data-id="${esc(idOf(c.k, p[0]))}" data-base="${p[1]}" aria-label="${s === "done" ? "Done" : "Mark done"}" title="${s === "done" ? "Done" : s === "wait" ? "Waiting on someone" : "To do"}"></button><div><div class="tx">${esc(p[0])}</div>${p[3] ? `<div class="nt">${esc(p[3])}</div>` : ""}</div><span class="dt">${fmtD(p[2])}</span></div>`;
      }).join("")}</div>` : "";
    }).join("");
    if (!groups) return "";
    return `<section class="cat" id="${c.k}" style="--c:${COL[c.k]}">
      <div class="ch"><div class="ico">${ICO[c.k]}</div><div><h3>${esc(c.n)}</h3><p>${esc(c.d)}</p></div>
      <div class="cnt"><span class="pill p-done">${n.done} done</span>${n.open ? `<span class="pill p-open">${n.open} to do</span>` : ""}${n.wait ? `<span class="pill p-wait">${n.wait} waiting</span>` : ""}</div></div>
      <div class="prog"><i style="width:${n.done / n.all * 100}%"></i></div>
      <div class="groups">${groups}</div></section>`;
  }).join("") || `<p class="sub">Nothing here.</p>`;
  document.querySelectorAll(".pt .st").forEach(b => b.onclick = () => {
    const id = b.dataset.id;
    if (b.dataset.base === "done") return;
    S[id] = !S[id]; if (!S[id]) delete S[id];
    store.set(STORE, JSON.stringify(S)); render();
  });
}
</script>
</body>
</html>
